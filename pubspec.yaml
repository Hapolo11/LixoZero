name: lixozero
description: "LixoZero: assistente doméstico de reciclagem."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  google_maps_flutter: ^2.19.0
  geolocator: ^14.0.1
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  intl: ^0.20.3
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  shared_preferences: ^2.5.6
  flutter_local_notifications: ">=22.3.3 <23.0.0"
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# A partir da 2.5.0, o shared_preferences_android usa a biblioteca nativa
# libdartjni.so, que não entra no APK deste projeto: o app fica numa tela preta
# porque o SharedPreferences.getInstance() falha antes do runApp.
# A 2.4.28 usa o canal normal e funciona. Remover quando isso for corrigido.
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-400.ttf
        - asset: assets/fonts/Montserrat-500.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-600.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
